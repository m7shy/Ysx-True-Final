openapi: 3.0.0
info:
  title: Email Gateway API
  version: 1.0.0
  description: API for sending emails and checking for replies via SMTP/IMAP using Gmail or Zoho.
servers:
  - url: http://localhost:3001
paths:
  /api/mail/send:
    post:
      summary: Send email
      description: Sends an email via configured SMTP provider.
      parameters:
        - in: query
          name: provider
          required: false
          schema:
            $ref: '#/components/schemas/Provider'
          description: The email provider to use.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendEmailRequest'
      responses:
        '200':
          description: Email sent successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SendEmailResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/mail/oauth/microsoft/device-code/start:
    post:
      summary: Start Microsoft OAuth2 Device Code flow (for IMAP XOAUTH2)
      description: Returns user_code and verification_uri for user authorization (plus device_code for polling).
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                tenantId:
                  type: string
                  description: Optional tenant ID (GUID). Overrides MICROSOFT_TENANT_ID.
                includeSmtpSend:
                  type: boolean
                  description: Optional. If true, also requests SMTP.Send scope.
      parameters:
        - in: query
          name: tenantId
          required: false
          schema:
            type: string
          description: Optional tenant ID (GUID). Overrides MICROSOFT_TENANT_ID.
        - in: query
          name: includeSmtpSend
          required: false
          schema:
            type: boolean
          description: Optional. If true, also requests SMTP.Send scope.
      responses:
        '200':
          description: Device code created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MicrosoftDeviceCodeStartResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/mail/oauth/microsoft/device-code/poll:
    post:
      summary: Poll Microsoft OAuth2 Device Code flow until authorized
      description: Polls the token endpoint and stores refresh token server-side when authorization completes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [device_code]
              properties:
                device_code:
                  type: string
                tenantId:
                  type: string
                includeSmtpSend:
                  type: boolean
      parameters:
        - in: query
          name: tenantId
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Authorized (tokens stored)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MicrosoftDeviceCodePollAuthorizedResponse'
        '202':
          description: Still pending
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MicrosoftDeviceCodePollPendingResponse'
        '400':
          description: Bad request / declined / expired
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:
    Provider:
      type: string
      enum:
        - gmail
        - zoho
        - microsoft
      description: The email service provider.

    SendEmailRequest:
      type: object
      required:
        - to
        - subject
        - body
      properties:
        to:
          type: string
          description: Recipient email address
        subject:
          type: string
          description: Email subject
        body:
          type: string
          description: Email body content

    SendEmailResponse:
      type: object
      properties:
        ok:
          type: boolean
        messageId:
          type: string

    ErrorResponse:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        error:
          type: object
          nullable: true

    MicrosoftDeviceCodeStartResponse:
      type: object
      description: Response from device-code start endpoint (includes values needed for user authorization and polling).
      properties:
        user_code:
          type: string
        device_code:
          type: string
        verification_uri:
          type: string
        expires_in:
          type: number
        interval:
          type: number
        message:
          type: string
        tenant:
          type: string
        scopes:
          type: array
          items:
            type: string

    MicrosoftDeviceCodePollAuthorizedResponse:
      type: object
      properties:
        ok:
          type: boolean
        mailboxUser:
          type: string
        tenant:
          type: string
        expiresAt:
          type: number

    MicrosoftDeviceCodePollPendingResponse:
      type: object
      properties:
        status:
          type: string
          enum: [pending, slow_down]
        error:
          type: string
        message:
          type: string
        interval:
          type: number
